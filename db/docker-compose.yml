version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aidb_postgres
    environment:
      POSTGRES_USER: aidb_user
      POSTGRES_PASSWORD: aidb_pass
      POSTGRES_DB: sales_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidb_user -d sales_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
